[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-db-mcp"
version = "0.1.0"
description = "Guarded SQL query gateway for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.0,<2",
  "httpx>=0.27,<1",
  "sqlglot==29.0.1",
  "SQLAlchemy>=2.0,<3",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "PyMySQL>=1.1,<2",
  "oracledb>=2.5,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[tool.setuptools.package-data]
safe_db_mcp = ["static/*"]

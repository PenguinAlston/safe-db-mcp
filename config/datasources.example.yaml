datasources:
  db_a:
    name: Orders database
    dialect: mysql
    url_env: DB_A_URL
    readonly_mode: mysql_transaction
    allowed_tables:
      - sales.orders
      - sales.order_items
    sensitive_columns: [customer_phone, payment_token]
    auto_execute: true
    max_auto_scan_rows: 10000
    max_hard_scan_rows: 1000000
    max_result_rows: 200
    max_result_bytes: 1048576
    timeout_ms: 5000

  db_b:
    name: Customer database
    dialect: postgres
    url_env: DB_B_URL
    readonly_mode: postgres_transaction
    allowed_tables: [public.customers, public.user_profiles]
    sensitive_columns: [email, phone, password_hash]
    auto_execute: true
    max_auto_scan_rows: 5000
    max_hard_scan_rows: 500000
    max_result_rows: 100
    max_result_bytes: 524288
    timeout_ms: 5000

  db_c:
    name: Finance database
    dialect: oracle
    url_env: DB_C_URL
    readonly_mode: unsupported
    allowed_tables: [FINANCE.INVOICES, FINANCE.PAYMENTS]
    sensitive_columns: [BANK_ACCOUNT, TAX_ID]
    auto_execute: false
    max_auto_scan_rows: 0
    max_hard_scan_rows: 100000
    max_result_rows: 100
    max_result_bytes: 524288
    timeout_ms: 3000

  db_d:
    name: Application logs
    dialect: mysql
    url_env: DB_D_URL
    readonly_mode: mysql_transaction
    allowed_tables: [logs.application_logs, logs.audit_logs]
    sensitive_columns: [authorization, access_token]
    auto_execute: true
    max_auto_scan_rows: 50000
    max_hard_scan_rows: 2000000
    max_result_rows: 500
    max_result_bytes: 1048576
    timeout_ms: 5000

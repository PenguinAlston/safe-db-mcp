services:
  api:
    build: .
    command: uvicorn safe_db_mcp.api:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SAFEDB_DB_PATH: /data/safedb.sqlite3
      SAFEDB_DATASOURCES_FILE: /app/config/datasources.yaml
      # Metadata-store URL (proposals, audit, results); never a datasource URL.
      SAFEDB_STORE_URL: ${SAFEDB_STORE_URL:-}
      SAFEDB_AGENT_TOKEN: ${SAFEDB_AGENT_TOKEN:?set SAFEDB_AGENT_TOKEN}
      SAFEDB_REVIEWER_TOKEN: ${SAFEDB_REVIEWER_TOKEN:?set SAFEDB_REVIEWER_TOKEN}
      SAFEDB_AGENT_ID: ${SAFEDB_AGENT_ID:-local-agent}
      SAFEDB_REVIEWER_ID: ${SAFEDB_REVIEWER_ID:-reviewer-dev}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    # API intentionally receives no database URL variables.

  worker:
    build: .
    command: python -m safe_db_mcp.worker
    environment:
      SAFEDB_DB_PATH: /data/safedb.sqlite3
      SAFEDB_DATASOURCES_FILE: /app/config/datasources.yaml
      SAFEDB_STORE_URL: ${SAFEDB_STORE_URL:-}
      SAFEDB_WORKER_INTERVAL_SECONDS: 1
      MYSQL8_URL: ${MYSQL8_URL:-}
      PG16_URL: ${PG16_URL:-}
      ORACLE19C_URL: ${ORACLE19C_URL:-}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    # Use a worker-only secret file / Secret Manager in production.
    # Restrict this service's network egress to approved database endpoints.
    # Do not expose worker ports.

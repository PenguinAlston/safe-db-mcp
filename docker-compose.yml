services:
  api:
    build: .
    command: uvicorn safe_db_mcp.api:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SAFEDB_DB_PATH: /data/safedb.sqlite3
      SAFEDB_DATASOURCES_FILE: /app/config/datasources.yaml
      SAFEDB_AGENT_TOKEN: ${SAFEDB_AGENT_TOKEN:?set SAFEDB_AGENT_TOKEN}
      SAFEDB_REVIEWER_TOKEN: ${SAFEDB_REVIEWER_TOKEN:?set SAFEDB_REVIEWER_TOKEN}
      SAFEDB_AGENT_ID: ${SAFEDB_AGENT_ID:-local-agent}
      SAFEDB_REVIEWER_ID: ${SAFEDB_REVIEWER_ID:-reviewer-dev}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    # API intentionally receives no database URL variables or local credential socket.

  worker:
    build: .
    command: python -m safe_db_mcp.worker
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SAFEDB_DB_PATH: /data/safedb.sqlite3
      SAFEDB_DATASOURCES_FILE: /app/config/datasources.yaml
      SAFEDB_WORKER_INTERVAL_SECONDS: 1
      SAFEDB_CREDENTIAL_SOCKET: /run/safedb/credentials.sock
      SAFEDB_WORKER_UI_ENABLED: "true"
      SAFEDB_WORKER_UI_HOST: 0.0.0.0
      SAFEDB_WORKER_UI_PORT: 8090
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - worker-run:/run/safedb
    # Run the credential CLI inside this service as appuser.
    # No database URL environment variables are passed to the Worker.
    # Restrict Worker network egress to approved bastion/database/cloud endpoints.

volumes:
  worker-run:
